[project]
name = "nasa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Naheem Quadri", email = "naheemquadri3410@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "earthaccess>=0.19.0",
    "geopandas>=1.2.0",
    "h5netcdf>=1.8.2",
    "h5py>=3.16.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyogrio>=0.13.0",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
    "shapely>=2.2.0",
    "sqlalchemy>=2.1.8",
    "tqdm>=4.70.1",
    "xarray>=2026.9.0",
]

[project.scripts]
nasa = "nasa:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
]
